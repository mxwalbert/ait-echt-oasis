services:
  api_host: "localhost"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/fairmat-nfdi/nomad-north-jupyter:latest
    exclude:
      - apps/2_theory/1_calculations
      - apps/2_theory/2_materials
      - apps/3_experiment/2_eels
      - pynxtools.nomad.entrypoints:nexus_app
      - example_uploads/1_basic_examples/1_theory
      - example_uploads/1_basic_examples/2_eln
      - example_uploads/1_basic_examples/3_tables
      - example_uploads/2_tutorials/1_rdm_tutorial
      - example_uploads/2_tutorials/2_cow_tutorial
      - pynxtools.nomad.entrypoints:simple_nexus_example

meta:
  deployment: 'ait-echt-oasis'
  deployment_url: 'localhost/api'
  maintainer_email: 'echt-oasis@ait.ac.at'

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
